# Bundle layer for dsh-subagent-settings-plugin.
# `name` must be the installed package name so the loader can import it.
- insert:
    - id: dsh-subagent-settings
      name: dsh-subagent-settings-plugin
      config:
        enabled: true
        inheritParent: false
        provider: codex-gateway-subagent
        model: gpt-5.6-terra
        reasoningEffort: xhigh
        fallbackProvider: ''
        fallbackModel: ''
        fallbackReasoningEffort: inherit
        maxConcurrent: 0
